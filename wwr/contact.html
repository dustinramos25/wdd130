<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Learn more about us at Verzet Company. We offer the best river rafting adventures, combining complete safety with fun.">
    <meta name="author" content="Dustin Ramos">
    <title>About Us - Verzet Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/boat1.png" alt="Rafting boat prepared for a river adventure">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Verzet Company</h1>
            <p>kilómetro 395.5 de la Panamericana Norte <br> Nuevo Chimbote Peru <br> 935 582 369
                <br>
                Verzet@gmail.com
            </p>
        </section>
        <section class="contact-area">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15746.551924179566!2d-78.4192818556278!3d-9.365267751360049!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91abbdbe31dfdb81%3A0x2b6b02513e6ea1db!2sTortuga%2002665!5e0!3m2!1ses!2spe!4v1791304885508!5m2!1ses!2spe"
                  width="300" height="200" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form class="contact-form">

                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder">
                </div>
                <fieldset>
                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>
                </div>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter">
                    Please Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>
        <section class="employees-section">

            <h2>We Are Here to Serve You</h2>

            <div class="employees">

                <figure>
                    <img src="images/goku.png" alt="Goku">
                    <figcaption>Goku</figcaption>
                </figure>

                <figure>
                    <img src="images/gohan.png" alt="Gohan">
                    <figcaption>Gohan</figcaption>
                </figure>

                <figure>
                    <img src="images/vegeta.png" alt="Vegeta">
                    <figcaption>Vegeta</figcaption>
                </figure>

            </div>

        </section>

    </main>
    <footer>
        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.icon1.png" alt="Facebook logo">
            </a>

            <a href="https://linkedin.com">
                <img src="images/LinkedIn.icon.png" alt="LinkedIn logo">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.icon.png" alt="Instagram logo">
            </a>

        </nav>
    </footer>
</body>

</html>
