<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>User Poll</title>
</head>

<header>
    <h1>Poll Week 5</h1>
</header>

<main>

    <form>
        <p>Contact Information</p>
        <div class="form-item">
            <label for="Fullname">Fullname:</label>
            <input type="text" id="fullname" name="fullname" required>
        </div>
    </form>
    <form>
        <div class="form-item column2">
            <label for="useremail">Email:</label>
            <input type="text" id="useremail" name="useremail" required>
        </div>
    </form>
    <form>
        <div class="for-item" colum1>
            <p>Questions</p>
            <label for="browser">What is your favorite internet browser?</label>
            <select name="browser" id="browser">
                <option value="1">Chrome</option>
                <option value="2">Explore</option>
                <option value="3">Brave</option>
                <option value="4">Firefox</option>
            </select>
        </div>
    </form>
    <form>
        <div class="form-item column2">
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
        </div>
    </form>
    <form>
        <div class="for-item" colum1>
            <label for="feedback">List the places you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
        </div>
    </form>

</main>


<footer>
    <button type="submit">Submit Poll</button>
    <p>©2026</p>
</footer>

</html>
